name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The 10.255.255.1 black-hole tests are not reliable on shared CI runners.
  AUDIDASH_SKIP_BLACKHOLE: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy packages tools

      - name: Tests with coverage
        run: uv run pytest --cov --cov-fail-under=85

      - name: SAST (bandit)
        run: uv run bandit -q -r packages plugins tools -x "*/tests/*"

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

      - name: Validate bundled plugins
        run: uv run audidash plugins validate plugins

  compose-smoke:
    name: compose smoke (Caddy mTLS + demo lab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with throwaway secrets
        run: |
          gen() { python3 -c "import secrets;print(secrets.token_urlsafe(48))"; }
          {
            echo "AUDIDASH_SECRET_KEY=$(gen)"
            echo "AUDIDASH_PROXY_SECRET=$(gen)"
            echo "AUDIDASH_CA_PASSPHRASE=$(gen)"
            echo "POSTGRES_PASSWORD=$(gen)"
          } > .env

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Dashboard listener serves /healthz
        run: curl -fsSk --retry 10 --retry-all-errors --retry-delay 2 https://localhost:8443/healthz

      - name: Device API is not reachable on the dashboard listener
        run: |
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/api/v1/assets)
          test "$code" = "404" || { echo "expected 404, got $code"; exit 1; }

      - name: API listener rejects clients without a certificate (TLS handshake)
        run: |
          set +e
          curl -sSk -o /dev/null https://localhost:9443/api/v1/assets
          rc=$?
          set -e
          echo "curl exit code: $rc"
          # 35 = TLS handshake error, 56 = alert received (TLS 1.3 certificate_required)
          test "$rc" = "35" || test "$rc" = "56"

      - name: API listener certificate chains to the internal CA with a localhost SAN
        run: |
          docker compose cp server:/data/proxy/ca.crt "$RUNNER_TEMP/ca.crt"
          openssl s_client -connect localhost:9443 -servername localhost \
            -CAfile "$RUNNER_TEMP/ca.crt" -verify_hostname localhost </dev/null 2>/dev/null \
            | grep -q "Verify return code: 0 (ok)"

      - name: Lab targets answer on loopback
        run: |
          curl -fsS -D - -o /dev/null http://127.0.0.1:18080/ | grep -qi '^server: nginx/1\.'
          set +e
          curl -sS -o /dev/null https://localhost:18443/
          rc=$?
          set -e
          test "$rc" = "60"  # certificate problem (expired)

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
