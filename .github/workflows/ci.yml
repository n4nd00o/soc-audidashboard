name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The 10.255.255.1 black-hole tests are not reliable on shared CI runners.
  AUDIDASH_SKIP_BLACKHOLE: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy packages tools

      - name: Tests with coverage
        run: uv run pytest --cov --cov-fail-under=85

      - name: SAST (bandit)
        run: uv run bandit -q -r packages plugins tools -x "*/tests/*"

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

      - name: Validate bundled plugins
        run: uv run audidash plugins validate plugins

  server-postgres:
    name: server tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.11-alpine
        env:
          POSTGRES_USER: audidash
          POSTGRES_PASSWORD: audidash-ci
          POSTGRES_DB: audidash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audidash -d audidash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable database: the fixtures drop and recreate its `public` schema, run the Alembic
      # migrations once per session and TRUNCATE every table between tests.
      AUDIDASH_TEST_DATABASE_URL: postgresql+psycopg://audidash:audidash-ci@localhost:5432/audidash_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Server test suite against PostgreSQL
        run: uv run pytest packages/audidash-server -q

  compose-smoke:
    name: compose smoke (Caddy mTLS + demo lab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: deploy
    steps:
      - uses: actions/checkout@v7

      - name: Create .env with throwaway secrets
        run: |
          gen() { python3 -c "import secrets;print(secrets.token_urlsafe(48))"; }
          {
            echo "AUDIDASH_SECRET_KEY=$(gen)"
            echo "AUDIDASH_PROXY_SECRET=$(gen)"
            echo "AUDIDASH_CA_PASSPHRASE=$(gen)"
            echo "POSTGRES_PASSWORD=$(gen)"
          } > .env

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Copy the internal CA certificate out of the stack
        run: docker compose cp server:/data/proxy/ca.crt "$RUNNER_TEMP/ca.crt"

      - name: Dashboard listener serves /healthz over TLS verified by the internal CA
        run: |
          curl -fsS --cacert "$RUNNER_TEMP/ca.crt" --retry 10 --retry-all-errors \
            --retry-delay 2 https://localhost:8443/healthz

      - name: Dashboard listener certificate chains to the internal CA (with and without SNI)
        run: |
          out=$(openssl s_client -connect localhost:8443 -servername localhost \
            -CAfile "$RUNNER_TEMP/ca.crt" -verify_hostname localhost </dev/null 2>/dev/null || true)
          grep -q "Verify return code: 0 (ok)" <<<"$out"
          # IP literal, no SNI: Caddy's default_sni still selects the internal-CA certificate.
          out=$(openssl s_client -connect 127.0.0.1:8443 -noservername \
            -CAfile "$RUNNER_TEMP/ca.crt" -verify_ip 127.0.0.1 </dev/null 2>/dev/null || true)
          grep -q "Verify return code: 0 (ok)" <<<"$out"

      - name: CA download matches the certificate the dashboard listener chains to
        run: |
          curl -fsS --cacert "$RUNNER_TEMP/ca.crt" -o "$RUNNER_TEMP/served-ca.pem" \
            https://localhost:8443/ca.pem
          cmp "$RUNNER_TEMP/ca.crt" "$RUNNER_TEMP/served-ca.pem"

      - name: Device API is not reachable on the dashboard listener
        run: |
          for path in /api /api/ /api/v1/assets /API/v1/assets; do
            code=$(curl -s --cacert "$RUNNER_TEMP/ca.crt" -o /dev/null -w '%{http_code}' \
              "https://localhost:8443$path")
            test "$code" = "404" || { echo "$path: expected 404, got $code"; exit 1; }
          done

      - name: API listener rejects clients without a certificate (TLS handshake)
        run: |
          set +e
          err=$(curl -sS --cacert "$RUNNER_TEMP/ca.crt" -o /dev/null https://localhost:9443/api/v1/assets 2>&1)
          rc=$?
          set -e
          echo "curl exit code: $rc: $err"
          # 35 = TLS handshake error; 55/56 = send/recv failed because the server sent the
          # TLS 1.3 certificate_required alert (which code depends on timing).
          case "$rc" in
            35) ;;
            55|56) grep -qi "certificate required" <<<"$err" ;;
            *) exit 1 ;;
          esac

      - name: API listener certificate chains to the internal CA with a localhost SAN
        run: |
          # Capture first: s_client exits non-zero after the certificate_required alert.
          out=$(openssl s_client -connect localhost:9443 -servername localhost \
            -CAfile "$RUNNER_TEMP/ca.crt" -verify_hostname localhost </dev/null 2>/dev/null || true)
          grep -q "Verify return code: 0 (ok)" <<<"$out"

      - name: Lab web target has no security headers and a version banner
        run: |
          hdrs=$(curl -fsS -D - -o /dev/null http://127.0.0.1:18080/)
          grep -qi '^server: nginx/1\.' <<<"$hdrs"
          if grep -qi '^content-security-policy:' <<<"$hdrs"; then exit 1; fi

      - name: Lab TLS target serves an expired certificate
        run: |
          set +e
          curl -sS -o /dev/null https://localhost:18443/
          rc=$?
          set -e
          test "$rc" = "60"  # certificate problem
          served=$(openssl s_client -connect localhost:18443 -servername localhost \
            </dev/null 2>/dev/null || true)
          end=$(openssl x509 -noout -enddate <<<"$served")
          echo "$end"
          case "$end" in *2020*) ;; *) echo "unexpected notAfter"; exit 1 ;; esac
          # -checkend 0 succeeds only for a certificate that is still valid now.
          if openssl x509 -noout -checkend 0 <<<"$served"; then
            echo "lab certificate is not expired"; exit 1
          fi

      - name: Lab Redis answers without authentication
        run: |
          pong=$(docker compose exec -T redis-open redis-cli ping)
          test "$pong" = "PONG"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the CLI (locked)
        working-directory: .
        run: uv sync --locked

      - name: End to end - enrol, log in, run `audidash demo`, check the findings
        working-directory: .
        env:
          AUDIDASH_E2E: "1"
        run: uv run pytest -m e2e deploy/tests/test_e2e_demo.py -q

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
