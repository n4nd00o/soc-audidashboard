[project]
name = "soc-audidashboard"
version = "0.1.0"
description = "Security-audit plugin platform with a findings dashboard (student project)."
readme = "README.en.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["audidash-core", "audidash-server"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
audidash-core = { workspace = true }
audidash-sdk = { workspace = true }
audidash-server = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["packages", "plugins"]
addopts = "-ra"
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:DeprecationWarning",
]
markers = [
    "network_blackhole: needs 10.255.255.1 to silently drop packets (skip with AUDIDASH_SKIP_BLACKHOLE=1)",
]

[tool.coverage.run]
source = ["audidash_core", "audidash_sdk"]
branch = false

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = ["packages/audidash-core/src", "packages/audidash-sdk/src", "packages/audidash-server/src"]
explicit_package_bases = true
