# SOC AudiDashboard demo stack. Run from this directory:
#   cp .env.example .env   (then fill in the secrets)
#   docker compose up -d --build
# Only Caddy (8443 dashboard, 9443 mTLS API) is published; the lab targets are
# INTENTIONALLY INSECURE and bound to 127.0.0.1 only.
name: audidash

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  db:
    <<: *hardening
    image: postgres:16.11-alpine
    # The entrypoint starts as root, fixes ownership and drops to "postgres".
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: audidash
      POSTGRES_DB: audidash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
      - /tmp
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "audidash", "-d", "audidash"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  server:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: audidash-server:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUDIDASH_DATABASE_URL: postgresql+psycopg://audidash:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/audidash
      AUDIDASH_SECRET_KEY: ${AUDIDASH_SECRET_KEY:?set AUDIDASH_SECRET_KEY in .env}
      AUDIDASH_PROXY_SECRET: ${AUDIDASH_PROXY_SECRET:?set AUDIDASH_PROXY_SECRET in .env}
      AUDIDASH_CA_PASSPHRASE: ${AUDIDASH_CA_PASSPHRASE:?set AUDIDASH_CA_PASSPHRASE in .env}
      AUDIDASH_DATA_DIR: /data
      AUDIDASH_PUBLIC_DASHBOARD_URL: ${AUDIDASH_PUBLIC_DASHBOARD_URL:-https://localhost:8443}
      AUDIDASH_PUBLIC_API_URL: ${AUDIDASH_PUBLIC_API_URL:-https://localhost:9443}
      AUDIDASH_API_HOSTS: ${AUDIDASH_API_HOSTS:-localhost,127.0.0.1}
    volumes:
      - server_data:/data
      - proxy_shared:/data/proxy
    tmpfs:
      - /tmp
    networks: [backend]

  proxy:
    <<: *hardening
    image: caddy:2.8.4-alpine
    user: "10001:10001"
    # The caddy binary carries the cap_net_bind_service file capability; keeping it in the
    # bounding set lets it exec. No privileged port is bound.
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      server:
        condition: service_healthy
    environment:
      AUDIDASH_PROXY_SECRET: ${AUDIDASH_PROXY_SECRET:?set AUDIDASH_PROXY_SECRET in .env}
      AUDIDASH_DASHBOARD_HOST: ${AUDIDASH_DASHBOARD_HOST:-localhost}
      XDG_DATA_HOME: /caddy/data
      XDG_CONFIG_HOME: /caddy/config
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_shared:/shared:ro
    tmpfs:
      # Caddy's internal CA for :8443 lives here (regenerated on restart).
      - /caddy:uid=10001,gid=10001,mode=0700
      - /tmp
    ports:
      - "${AUDIDASH_BIND_ADDRESS:-127.0.0.1}:8443:8443"
      - "${AUDIDASH_BIND_ADDRESS:-127.0.0.1}:9443:9443"
    networks: [backend, edge]

  # ---- Demo lab: intentionally vulnerable targets, reachable from the host only ----
  web-noheaders:
    <<: *hardening
    build: ../lab/web-noheaders
    image: audidash-lab-web-noheaders:local
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:18080:8080"
    networks: [lab]

  tls-expired:
    <<: *hardening
    build: ../lab/tls-expired
    image: audidash-lab-tls-expired:local
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:18443:8443"
    networks: [lab]

  redis-open:
    <<: *hardening
    image: redis:7.4-alpine
    user: redis
    command: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
      - /tmp
    ports:
      - "127.0.0.1:16379:6379"
    networks: [lab]

networks:
  # No egress for db/server; Caddy reaches the host through "edge".
  backend:
    internal: true
  edge: {}
  lab: {}

volumes:
  db_data: {}
  server_data: {}
  proxy_shared: {}
