# INTENTIONALLY INSECURE demo target: HTTPS with a certificate that expired on 2020-01-02.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    default_type text/plain;

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/lab/lab.crt;
        ssl_certificate_key /etc/nginx/lab/lab.key;
        location / {
            return 200 "tls-expired lab target\n";
        }
    }
}
