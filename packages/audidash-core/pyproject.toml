[project]
name = "audidash-core"
version = "0.1.0"
description = "Core schemas, runner, sanitizer and scoring for SOC AudiDashboard."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audidash_core"]
