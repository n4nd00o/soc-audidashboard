<tr id="asset-{{ asset.id }}" class="editing">
  <td colspan="9">
    <form class="asset-form" method="post" action="/assets/{{ asset.id }}" hx-post="/assets/{{ asset.id }}" hx-target="#asset-{{ asset.id }}" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      {% include "assets/_fields.html" %}
      <div class="form-actions">
        <button type="submit">Salvar</button>
        <a href="/assets">Cancelar</a>
      </div>
    </form>
  </td>
</tr>
