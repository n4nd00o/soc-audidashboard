{% extends "base.html" %}
{% block title %}Entrar · SOC AudiDashboard{% endblock %}
{% block content %}
<section class="card auth">
  <h1>Entrar</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
    <label for="username">Usuário</label>
    <input id="username" name="username" type="text" value="{{ username }}" maxlength="64"
           autocomplete="username" required autofocus>
    <label for="password">Senha</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <label for="totp">Código do autenticador (6 dígitos)</label>
    <input id="totp" name="totp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
           autocomplete="one-time-code">
    <p class="hint">No primeiro acesso, deixe o código em branco: você vai configurar o autenticador em seguida.</p>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
