[project]
name = "audidash-server"
version = "0.2.0a1"
description = "FastAPI server and dashboard for SOC AudiDashboard."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "audidash-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.12.1",
    "cryptography>=50.0.2",
    "segno>=1.6.6",
]

[project.scripts]
audidash-server = "audidash_server.cli:main"

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.uv.sources]
audidash-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audidash_server"]
