[project]
name = "audidash-server"
version = "0.2.0a1"
description = "FastAPI server and dashboard for SOC AudiDashboard."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "audidash-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.uv.sources]
audidash-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audidash_server"]
